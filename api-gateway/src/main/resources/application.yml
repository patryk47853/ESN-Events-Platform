spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:4200
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - Authorization
            allow-credentials: true
            max-age: 3600

      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: event-service
          uri: ${EVENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/events/**

        - id: ticket-service
          uri: ${TICKET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/tickets/**
          filters:
            - RewritePath=/api/tickets(?<segment>/?.*), /tickets${segment}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

  endpoint:
    health:
      show-details: always