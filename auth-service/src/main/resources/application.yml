spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/esn_events}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

jwt:
  secret: RVMtRVZFTlRTLUpXVC1ERVYtU0VDUkVULUtFWS1GT1ItSFMtMjU2LTAx
  expiration: 3600000